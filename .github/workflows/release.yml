name: Publish stable template
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching 发布.json (for example 2.1.0)
        required: true
      commit:
        description: Exact 40 character commit on main
        required: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tzdata
      - name: Verify requested identity
        shell: python
        run: |
          import json, os, re, subprocess
          from pathlib import Path
          version, commit = os.environ['RELEASE_VERSION'], os.environ['RELEASE_COMMIT']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          assert json.loads(Path('发布.json').read_text(encoding='utf-8'))['version'] == version
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == commit
          subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'origin/main'], check=True)
      - run: python tests/run_suite.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python 发布工具.py --output dist
      - name: Generate notes
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text(encoding='utf-8'))
          text = manifest['summary'] + '\n\nSource: ' + manifest['source_commit'] + '\n\n'
          text += '\n'.join('- ' + item for item in manifest['known_limits'])
          Path('dist/notes.md').write_text(text + '\n', encoding='utf-8')
      - name: Publish only after all assets are uploaded
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; never overwrite a published identity.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$RELEASE_COMMIT" --draft --title "$tag" --notes-file dist/notes.md
          gh release upload "$tag" dist/ai-sma-template.zip dist/release-manifest.json dist/checksums.json
          gh release edit "$tag" --draft=false --latest
